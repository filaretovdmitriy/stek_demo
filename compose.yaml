services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stek}
      POSTGRES_USER: ${POSTGRES_USER:-stek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stek}
      PSQLRC: /etc/postgresql/psqlrc
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/psqlrc:/etc/postgresql/psqlrc:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stek} -d ${POSTGRES_DB:-stek}"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build:
      context: ./docker/php
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-stek}
      DB_USER: ${POSTGRES_USER:-stek}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-stek}
    ports:
      - "${PHP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
